services:
  postgres:
    image: postgres:16
    container_name: finsight-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: finsight_db
      POSTGRES_USER: finsight_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - finsight_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight_user -d finsight_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  finsight_postgres_data: